<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chaos Cube: The Genesis Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #06080a;
      color: #d8dee9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #game-container {
      width: 900px;
      position: relative;
      background-color: #12151b;
      border: 2px solid #c99a45;
      border-radius: 8px;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 600px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Game interface elements will go here -->
  </div>
</body>
</html>
